kind: Krepe
apiVersion: krepe.io/v1
metadata:
  name: sample_pkg_with_pkg_installed_pkg
imports:
  files:
    - deployment.yaml
    - service.yaml
    - ingress.yaml
  packages:
    - relativePath: ../sample_pkg
      name: sample_pkg
pipelines:
  - name: mypipeline
    steps:
      - function: set-labels
        configMap:
          foo: bar
  - name: badpipeline
    steps:
      - function: run-fail
  - name: no-op-pipeline
    steps:
      - function: succeed
  - name: fail-on-file-import
    steps:
      - function: jsonpatch
        target:
          kind: Deployment
        configMap:
          op: test
          path: /spec/replicas
          value: 4
  - name: fail-on-package-import
    steps:
      - function: jsonpatch
        target:
          kind: Deployment
        configMap:
          op: test
          path: /spec/replicas
          value: 3
  - name: same-as-subpkg-pipeline
    steps:
      - function: set-labels
        target:
          kind: Ingress
        configMap:
          foo: rootpkg
